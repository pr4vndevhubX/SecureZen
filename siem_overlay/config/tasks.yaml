# ============================================================================
# IP INTELLIGENCE CREW - TASK DEFINITIONS
# ============================================================================

task_coordinator:
  description: >
    You are receiving these specific IP addresses to investigate: {ip_addresses}
    
    1. Parse and validate the IP addresses
    2. Split comma-separated IPs into individual addresses
    3. Remove any duplicates
    4. Prepare the validated IP list for analysis
  expected_output: >
    List of valid IPs to be analyzed.
  agent: coordinator_agent

task_virustotal_check:
  description: >
    Query VirusTotal API for each IP address provided by the coordinator.
    Collect malicious vendor count, reputation scores, and determine verdict.
  expected_output: >
    VirusTotal Analysis Results listing detection rates and verdicts.
  agent: virustotal_agent
  context: [task_coordinator]

task_abuseipdb_check:
  description: >
    Query AbuseIPDB for each IP address. Collect abuse confidence scores,
    ISP info, and whitelist status.
  expected_output: >
    AbuseIPDB Analysis Results with confidence scores.
  agent: abuseipdb_agent
  context: [task_coordinator]

task_yeti_check:
  description: >
    Search internal Yeti threat intelligence platform for each IP address.
    Check for existing tags/threats.
  expected_output: >
    Yeti Threat Intelligence Results indicating if IP is known internally.
  agent: yeti_agent
  context: [task_coordinator]

task_siem_query:
  description: >
    Query Wazuh SIEM for historical alerts related to the IP address.
  expected_output: >
    Summary of past alerts involving this IP from Wazuh.
  agent: siem_agent
  context: [task_coordinator]

task_alert_triage:
  description: >
    Assess the severity of the findings and assign a priority level (P1-P5).
  expected_output: >
    Triage Priority Level with justification.
  agent: alert_triage_agent
  context: [task_coordinator]

task_mitre_context:
  description: >
    Retrieve relevant MITRE ATT&CK techniques associated with the observed behavior.
    Use the RAG tool to search for context. 
    
    STRICT RULE: Do not provide any conversational preamble. Use the tools provided 
    and return the result in the JSON/XML format the framework expects.
  expected_output: >
    Mapped MITRE techniques and descriptions in a structured format.
  agent: mitre_context_agent
  context: [task_coordinator]

task_correlation_analysis:
  description: >
    Correlate findings from ALL sources (VT, AbuseIPDB, Yeti, SIEM, ML, MITRE) 
    to determine the overall threat level.
  expected_output: >
    Correlation Analysis Report with final threat classification.
  agent: analyst_agent
  context:
    - task_coordinator
    - task_virustotal_check
    - task_abuseipdb_check
    - task_yeti_check
    - task_siem_query
    - task_alert_triage
    - task_mitre_context

task_generate_report:
  description: >
    Generate a comprehensive IP Threat Intelligence Report with clear
    verdict, threat intelligence findings, risk assessment, and actionable
    recommendations.
  expected_output: >
    # 🔵 IP Threat Intelligence Report
    ... (Markdown formatting) ...
  agent: reporter_agent
  context:
    - task_coordinator
    - task_virustotal_check
    - task_abuseipdb_check
    - task_yeti_check
    - task_correlation_analysis